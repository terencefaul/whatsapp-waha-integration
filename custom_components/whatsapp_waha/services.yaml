      required: false
      selector:
        text:
    phone_number:
      required: true
      selector:
        text:

send_message:
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    chat_id:
      required: false
      selector:
        text:
    group_name:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    reply_to:
      required: false
      selector:
        text:
    link_preview:
      required: false
      default: false
      selector:
        boolean:
    priority:
      required: false
      default: normal
      selector:
        select:
          options:
            - normal
            - alert
    wait:
      required: false
      default: false
      selector:
        boolean:

