      required: false
      selector:
        text:
    group_name:
      required: false
      selector:
        text:
    latitude:
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
    name:
      required: false
