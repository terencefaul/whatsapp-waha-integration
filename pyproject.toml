[project]
name = "whatsapp-waha-integration"
version = "0.1.0"
description = "Home Assistant custom integration for a self-hosted WAHA (WhatsApp HTTP API) gateway"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
